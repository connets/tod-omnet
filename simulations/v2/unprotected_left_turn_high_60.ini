include General.ini
[Config unprotected_left_turn]
#gNodeb is used for reserve blocks in SIDELINK communications
*.carlaCommunicationManager.extraInitParams = parseJSON("{'config_name': 'unprotected_left_turn'}")

**.ueD2DTx[*].mobility.initialX = -70m
**.ueD2DTx[*].mobility.initialY = 120m

**.bgUeTod_1[*].mobility.initialX = -50m
**.bgUeTod_1[*].mobility.initialY = 120m

**.numUeD2DTx = ${SLDistrurbing=6}
**.numTodBgUes = ${BgUe=6}
**.statusUpdateIntervalCoop = ${statusUpdateIntervalCoop=1.0s} #0.016s 60fps, 0.033 30fps
**.statusUpdateInterval = ${statusUpdateInterval=0.016s} #0.016s 60fps, 0.033 30fps


[Config unprotected_left_turn-noCooperativePerception]
extends = unprotected_left_turn
*.VectorVehicle[0].app[0].zeroDelay = ${zeroDelay=true, false}

[Config unprotected_left_turn-Vehicle2Vehicle]
extends = unprotected_left_turn
#Vehicles send and receive informations using SIDELINK

*.VectorVehicle[0].numApps = 2
#COOP APP
*.VectorVehicle[*].app[0].typename = "CooperativePerceptionCarApp"
*.VectorVehicle[*].app[0].destAddressesCoop = "224.0.0.3"
*.VectorVehicle[*].app[0].destPort = 5000
#TOD APP
*.VectorVehicle[0].app[1].typename = "TODCarApp"
*.VectorVehicle[0].app[1].destAddress = "server"
*.VectorVehicle[0].app[1].destPort = 3000
*.VectorVehicle[0].app[1].zeroDelay = ${zeroDelay=true, false}

#1 => COOP APP INSTALLED, 0 => NO APP IS INSTALLED
*.VectorVehicle[1..100].numApps = 1

[Config unprotected_left_turn-Infrastructure2Vehicle]
extends = unprotected_left_turn
#edge device observe and send informations to Vehicles using 5G SIDELINK
#Vehicles do not send cooperative informations
*.VectorVehicle[0].numApps = 2
#COOP APP
*.VectorVehicle[*].app[0].typename = "CooperativePerceptionCarApp"
*.VectorVehicle[*].app[0].destAddressesCoop = "224.0.0.3"
*.VectorVehicle[*].app[0].destPort = 5000
*.VectorVehicle[*].app[0].onlyReceive = true
#TOD APP
*.VectorVehicle[0].app[1].typename = "TODCarApp"
*.VectorVehicle[0].app[1].destAddress = "server"
*.VectorVehicle[0].app[1].destPort = 3000
*.VectorVehicle[0].app[1].zeroDelay = ${zeroDelay=true, false}

*.VectorVehicle[1..100].numApps = 1

*.VectorEdgeCamera[*].numApps = 1
#COOP APP
*.VectorEdgeCamera[*].app[0].typename = "CooperativePerceptionCarApp"
*.VectorEdgeCamera[*].app[0].destAddressesCoop = "224.0.0.3"
*.VectorEdgeCamera[*].app[0].destPort = 5000



[Config unprotected_left_turn-Infrastructure_to_Server]
extends = unprotected_left_turn
#edge device observe and send informations directly to TOD agent

#app[0] is TOD CAR APP
*.VectorVehicle[0].app[0].zeroDelay = ${zeroDelay=true, false}

**.server.numApps = 2
#app[0] is "TODAgentApp"
**.server.app[1].typename = "CooperativePerceptionCarApp"
**.server.app[1].destPort = 5000
**.server.app[1].agentId = "Agent01" #specifying agentId the app only receive cooperative messages and send to AgentGenericMessage

*.VectorEdgeCamera[*].numApps = 1
*.VectorEdgeCamera[*].app[0].typename = "CooperativePerceptionCarApp"
*.VectorEdgeCamera[*].app[0].destAddressesCoop = "server"
*.VectorEdgeCamera[*].app[0].destPort = 5000











[Config unprotected_left_turn-Device2Infrastructure_to_Server]
extends = unprotected_left_turn
#edge device receive informations from Vehicles using 5G SIDELINK,and generate his view
#edge device send aggregated information directly to TOD agent
#multi edge device

**.server.numApps = 2
#app[0] is "TODAgentApp"
**.server.app[1].typename = "CooperativePerceptionCarApp"
**.server.app[1].destPort = 5000
**.server.app[1].agentId = "Agent01" #specifying agentId the app only receive cooperative messages and send to AgentGenericMessage


*.VectorEdgeCamera[*].numApps = 1
*.VectorEdgeCamera[*].app[0].typename = "CooperativePerceptionCarApp"
*.VectorEdgeCamera[*].app[0].destAddressesCoop = "server"
*.VectorEdgeCamera[*].app[0].destPort = 5000
#*.VectorEdgeCamera[*].app[0].onlyReceive = true