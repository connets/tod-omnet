[General]
network = tod_network.simulations.v2.QuicUeTest
sim-time-limit = 5s
**.routingRecorder.enabled = false
**.vector-recording = false

# ---- mobility bounds (from simu5g standalone) ----
**.mobility.constraintAreaMaxX = 1000m
**.mobility.constraintAreaMaxY = 1000m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

# ---- 5G radio ----
**.numBands = 50
**.ueTxPower = 26dBm
**.eNodeBTxPower = 40dBm
**.targetBler = 0.01
**.blerShift = 5

*.configurator.config = xmldoc("./quic_demo.xml")

# ---- gNB + UE placement ----
*.gnb.mobility.initialX = 450m
*.gnb.mobility.initialY = 300m
*.numUe = 1
*.ue[0].mobility.typename = "StationaryMobility"   # CarlaCar defaults to TodCarlaInetMobility (needs the manager)
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 350m

# ---- QUIC (same as the working INET datagram_test) ----
**.quic.typename = "Quic"
**.quic.initialMaxData = 100MB
**.quic.initialMaxStreamData = 100MB
**.quic.maxDatagramFrameSize = 1200B
**.quic.numReceivedAckElicitingsBeforeAck = 1

# ---- UE: QUIC datagram sender -> server ----
*.ue[*].numApps = 1
*.ue[0].app[0].typename = "QuicDatagramSender"
*.ue[0].app[0].connectAddress = "server"
*.ue[0].app[0].connectPort = 1000
*.ue[0].app[0].localPort = 1001
*.ue[0].app[0].numDatagrams = 10
*.ue[0].app[0].datagramBytes = 800B
*.ue[0].app[0].sendInterval = 20ms

# ---- server: QUIC datagram receiver ----
*.server.hasQuic = true
*.server.numApps = 1
*.server.app[0].typename = "QuicDatagramReceiver"
*.server.app[0].localPort = 1000

# ============================================================
# VARIANT A: simu5g 1.4.x cell association (KNOWN WORKING)
[Config Working]
*.ue[0].servingNodeId = 0
*.ue[0].nrServingNodeId = 1

# VARIANT B: General.ini-style association (old macCellId/masterId)
[Config CarlaCells]
*.ue[0].macCellId = 0
*.ue[0].masterId = 0
*.ue[0].nrMacCellId = 1
*.ue[0].nrMasterId = 1

# VARIANT C: CarlaCells + HostAutoConfigurator (exactly like General.ini)
[Config CarlaCellsAndIP]
extends = CarlaCells
*.ue[0].ipv4.configurator.typename = "HostAutoConfigurator"
*.ue[0].ipv4.configurator.interfaces = "cellular"


# ============================================================
# CAPACITA' DELL'UPLINK al variare di distanza e parametri radio.
#
# Serve a dimensionare lo scenario TOD, che chiede 7,6 Mbps in uplink. La sorgente e'
# satura (25,6 Mbps offerti, ben oltre qualsiasi capacita'): quello che arriva al server
# E' la capacita' del link. Le distanze sono quelle vere del percorso city_trip_world_4:
# 1100 m era la distanza tipica dal gNB com'era posizionato davvero (726,277), 341 m e'
# la distanza MASSIMA col gNB spostato sul baricentro del percorso.
[Config UplinkCapacity]
extends = Working
sim-time-limit = 5s
cmdenv-express-mode = true
**.mobility.constraintAreaMaxX = 3000m
**.mobility.constraintAreaMaxY = 3000m
**.eNodeBTxPower = 46dBm
*.ue[0].app[0].numDatagrams = 100000
*.ue[0].app[0].sendInterval = 0.25ms
**.quic.maxDatagramQueueLength = 64

# com'era: gNB di fatto a ~1100 m, radio da handset
[Config CapOld1100]
extends = UplinkCapacity
*.ue[0].mobility.initialX = 450m
*.ue[0].mobility.initialY = 1400m

# solo antenne/potenza/banda migliorate, gNB ancora lontano
[Config CapAntenna1100]
extends = CapOld1100
**.numBands = 100
**.ueTxPower = 31dBm
**.antennaGainUe = 3dBi
**.antennGainEnB = 21dBi
**.cableLoss = 0.5dB

# antenne + gNB riposizionato: distanza massima del percorso
[Config CapNew341]
extends = CapAntenna1100
*.ue[0].mobility.initialY = 641m
