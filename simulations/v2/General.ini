##SL Distrurbing
# D2D-capable flows are started in D2D mode
**.ueD2DTx[*].cellularNic.d2dInitialMode = true

#**.numUeD2DTx = ${SLDistrurbing=0, 10}
# Place D2D endpoints far from the gNodeB (~50m) and close to each other (20m)
**.ueD2DTx[*].mobility.initFromDisplayString = false

**.ueD2DTx[*].macCellId = 0
**.ueD2DTx[*].masterId = 0
**.ueD2DTx[*].nrMacCellId = 1
**.ueD2DTx[*].nrMasterId = 1

**.ueD2DTx[0].numApps = 2
**.ueD2DTx[1..100].numApps = 1

**.ueD2DTx[*].app[0].typename = "UdpBasicApp"
**.ueD2DTx[*].app[0].destAddresses = "ueD2DTx[0]"
**.ueD2DTx[*].app[0].destPort = 1000
**.ueD2DTx[*].app[0].messageLength = 33kB
**.ueD2DTx[*].app[0].sendInterval = 0.020s
**.ueD2DTx[*].app[0].packetName = "UDPData-D2D"

**.ueD2DTx[0].app[1].typename = "UdpSink"
**.ueD2DTx[0].app[1].localPort = 1000


##UL/DL Disturbing
#**.numTodBgUes = ${BgUe=0, 10}

**.bgUeTod_1[*].mobility.initFromDisplayString = false

**.bgUeTod_1[*].macCellId = 0
**.bgUeTod_1[*].masterId = 0
**.bgUeTod_1[*].nrMacCellId = 1
**.bgUeTod_1[*].nrMasterId = 1

**.bgUeTod_1[0].numApps = 2
**.bgUeTod_1[1..100].numApps = 1

**.bgUeTod_1[*].app[0].typename = "UdpBasicApp"
**.bgUeTod_1[*].app[0].destAddresses = "bgUeTod_1[0]"
**.bgUeTod_1[*].app[0].destPort = 1000
**.bgUeTod_1[*].app[0].messageLength = 33kB
**.bgUeTod_1[*].app[0].sendInterval = 0.020s
**.bgUeTod_1[*].app[0].packetName = "UDPData-ULDL"

**.bgUeTod_1[0].app[1].typename = "UdpSink"
**.bgUeTod_1[0].app[1].localPort = 1000




