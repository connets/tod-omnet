#**.statusUpdateInterval = ${statusUpdateInterval=0.033s} #0.016s 60fps, 0.033 30fps

**.statusMessageLengthCoop = ${statusMessageLengthCoop=1kB}
**.statusMessageLength = ${statusMessageLength=33kB}
