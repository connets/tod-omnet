# =============================================================================
#  Sottosistema sensori parametrico per il veicolo eroe (VectorVehicle[0]).
#
#  Numero di sensori, tipi (preset) e TUTTI i parametri (streamID, dataSize,
#  updateInterval, etichette) sono gestiti da questo .ini: per aggiungere o
#  ritoccare un sensore non serve toccare NED o C++.
#
#  Uso:
#     opp_run ... -c TOD-Sensors           (baseline ~30 Mbit/s, dentro i 32)
#     opp_run ... -c TOD-Sensors-Stress     (sfora la banda per stress test)
#
#  Preset disponibili (tipi NED, tutti sulla classe C++ SensorBaseApp):
#     CameraSensorApp  -> ~20KB, updateInterval=0s  (emette a ogni poll, 60 fps)
#     LidarSensorApp   -> ~90KB, updateInterval=0.1s (10 Hz)
#     RadarSensorApp   -> ~5KB,  updateInterval=0.0666s (~15 Hz)
# =============================================================================
include General.ini


[Config TOD-Sensors]
# --- Il veicolo eroe monta il sottosistema sensori al posto della sola TODCarApp
*.VectorVehicle[0].numApps            = 1
*.VectorVehicle[0].app[0].typename    = "SensorsManager"
*.VectorVehicle[0].app[0].sensorNumber = 6

# --- Parametri della TODCarApp, ora annidata dentro il SensorsManager ---------
*.VectorVehicle[0].app[0].todCarApp.destAddress          = "server"
*.VectorVehicle[0].app[0].todCarApp.destPort             = 3000
*.VectorVehicle[0].app[0].todCarApp.statusMessageLength  = 33kB
*.VectorVehicle[0].app[0].todCarApp.statusUpdateInterval = 0.016667s          # 60 fps: cadenza del poll ai sensori
*.VectorVehicle[0].app[0].todCarApp.encodingImageTime    = normal(10ms, 0.5ms)
*.VectorVehicle[0].app[0].todCarApp.collectionDataTime   = normal(15ms, 0.1ms)

# --- Tipi dei sensori: regole SPECIFICHE prima del wildcard (first-match-wins)
*.VectorVehicle[0].app[0].sensors[4].typename = "LidarSensorApp"
*.VectorVehicle[0].app[0].sensors[5].typename = "RadarSensorApp"
*.VectorVehicle[0].app[0].sensors[*].typename = "CameraSensorApp"             # indici 0..3 = 4 camere

# --- streamID QUIC espliciti (stream 0 riservato a status/control) ------------
*.VectorVehicle[0].app[0].sensors[0].streamID = 4
*.VectorVehicle[0].app[0].sensors[1].streamID = 8
*.VectorVehicle[0].app[0].sensors[2].streamID = 12
*.VectorVehicle[0].app[0].sensors[3].streamID = 16
*.VectorVehicle[0].app[0].sensors[4].streamID = 20
*.VectorVehicle[0].app[0].sensors[5].streamID = 24

# --- Etichette (sovrascrivono il sensorType di default del preset Camera) ------
*.VectorVehicle[0].app[0].sensors[0].sensorType = "CameraFront"
*.VectorVehicle[0].app[0].sensors[1].sensorType = "CameraLeft"
*.VectorVehicle[0].app[0].sensors[2].sensorType = "CameraRight"
*.VectorVehicle[0].app[0].sensors[3].sensorType = "CameraRear"

# --- Dimensioni per-sensore: front FullHD piena, secondarie a qualita' ridotta
#     (budget FIT ~30,8 Mbit/s sui 32 disponibili)
*.VectorVehicle[0].app[0].sensors[0].dataSize = uniform(16000B, 24000B)       # front ~20KB @60Hz  -> ~9,6 Mbit/s
*.VectorVehicle[0].app[0].sensors[1].dataSize = uniform(8000B, 12000B)        # left  ~10KB @60Hz  -> ~4,8 Mbit/s
*.VectorVehicle[0].app[0].sensors[2].dataSize = uniform(8000B, 12000B)        # right ~10KB @60Hz  -> ~4,8 Mbit/s
*.VectorVehicle[0].app[0].sensors[3].dataSize = uniform(6400B, 9600B)         # rear  ~8KB  @60Hz  -> ~3,8 Mbit/s
#   lidar (idx 4) ~90KB @10Hz -> ~7,2 Mbit/s e radar (idx 5) ~5KB @15Hz -> ~0,6 Mbit/s
#   usano dataSize/updateInterval dei rispettivi preset NED.


[Config TOD-Sensors-Stress]
extends = TOD-Sensors
# Tutte le camere a piena risoluzione + lidar denso: sfora di proposito la banda
# per stressare le code QUIC/RLC e osservare ritardo/accodamento.
*.VectorVehicle[0].app[0].sensors[0].dataSize = uniform(20000B, 28000B)
*.VectorVehicle[0].app[0].sensors[1].dataSize = uniform(16000B, 24000B)
*.VectorVehicle[0].app[0].sensors[2].dataSize = uniform(16000B, 24000B)
*.VectorVehicle[0].app[0].sensors[3].dataSize = uniform(16000B, 24000B)
*.VectorVehicle[0].app[0].sensors[4].dataSize = uniform(120000B, 150000B)     # lidar denso


# =============================================================================
#  Qualita' camera adattiva: l'anello di retroazione.
#
#  L'auto misura quanto e' vecchia ogni istruzione che le arriva (istante di
#  arrivo meno istante di campionamento del frame che l'ha prodotta), ne fa una
#  EWMA e da quella sceglie un livello di qualita'. Il livello scende ai sensori
#  sullo stesso poll che chiede i dati, le camere tagliano i byte in proporzione
#  ai pixel del gradino, e la rete si scarica: meno byte -> meno ritardo ->
#  risalita di livello. L'isteresi evita che il livello oscilli sulla soglia.
#
#  Il livello viaggia anche nei datagram verso l'agente, che lo gira a CARLA nel
#  COMPUTE_INSTRUCTION: l'agente sa a che risoluzione stava guardando la strada.
#
#  Statistiche: instructionRttEwma e qualityLevel su VectorVehicle[0].
# =============================================================================
[Config TOD-Sensors-Adaptive]
extends = TOD-Sensors-Stress
# Soglie di discesa sull'RTT istruzione: 4 livelli, come i 4 gradini della camera.
*.VectorVehicle[0].app[0].todCarApp.qualityRttThresholds = "60ms 120ms 220ms"
*.VectorVehicle[0].app[0].todCarApp.rttEwmaAlpha         = 0.2    # reattivita' della media
*.VectorVehicle[0].app[0].todCarApp.qualityHysteresis    = 0.2    # 20% di banda morta in risalita

# Scala di qualita' delle quattro camere. dataSize resta il valore al PRIMO
# gradino: gli altri lo scalano in proporzione ai pixel (960x540 = 56% dei pixel
# di 1280x720, 640x360 = 25%, 320x180 = 6%).
*.VectorVehicle[0].app[0].sensors[0..3].qualityResolutions = "1280x720 960x540 640x360 320x180"

# Lidar e radar restano fuori dall'adattamento: la scala e' solo sulle camere.
*.VectorVehicle[0].app[0].sensors[4..5].qualityResolutions = ""
