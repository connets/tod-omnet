#############################################################################
# Datagram TOD scenario (Fase 2) — CLEAN co-sim config.
#
# Hero vehicle streams sensor data over QUIC DATAGRAM (RFC 9221) while status
# stays on reliable stream 0; the agent computes a per-sensor weighted loss_ratio.
#
# Built on the PROVEN QUIC-over-5G recipe (see quic_standalone.ini): MAIN
# Ipv4NetworkConfigurator + servingNodeId/nrServingNodeId for the UE.
# (HostAutoConfigurator + macCellId, as in the old General.ini, leave the UE with
# no route to the server and break the QUIC handshake.)
# The single cell has since become FOUR cells along the route, meshed over X2, with
# dynamic cell association + handover (see the gNB/handover/X2 sections below).
#
# Needs INET built WITH the datagram patch (inet-patches/setup-inet.sh apply) and
# CARLA + tod-carla up. Run:  tod-omnet -c DatagramTOD datagram_tod.ini
#############################################################################
[Config DatagramTOD]
network = tod_network.simulations.v2.DatagramNet
sim-time-limit = 300s         # tod-carla stops CARLA at (sim_time_limit - 10s) => ~290s driving (molti giri; il route ora fa loop)

# ---------- 5G radio + mobility bounds ----------
# CAPACITA' UPLINK MISURATA con quic_standalone.ini [Config Cap*] (sorgente satura,
# la stessa cella, distanze reali del percorso):
#   com'era (1100 m, 26dBm, 0dBi, 50 RB) .................  3,6 Mbps
#   + antenne/potenza/banda, stessa distanza .............. 20,5 Mbps
#   + gNB riposizionato (341 m, il caso peggiore) ......... 62,3 Mbps
# I 7,6 Mbps offerti dai 6 sensori passano dal 212% della capacita' (sovraccarico di
# 2x: il collasso era garantito) al 12%.
# Con le QUATTRO celle (sotto) il caso peggiore scende ancora da 341 m a 127 m: sono
# altri ~17 dB di path loss risparmiati nel punto piu' sfavorevole del giro, cioe' un
# margine che non dipende piu' da DOVE si trova l'auto lungo il percorso.
#
# 100 RB a numerologia 1 (SCS 30 kHz) = ~36 MHz di portante, il doppio dei 50 RB
# di partenza. NB: la variante commentata in General.ini (numerology=0 + numBands=100)
# NON e' un raddoppio, e' la stessa banda con SCS 15 kHz.
**.numBands = 100
**.carrierAggregation.componentCarrier[*].numerologyIndex = 1
**.targetBler = 0.01
**.blerShift = 5

# Interferenza inter-cella. Il default di simu5g e' false, e con UNA cella era
# irrilevante (non c'era nessun altro a disturbare). Con quattro celle che riusano le
# stesse risorse lasciarla spenta regalerebbe un guadagno che nella realta' non esiste:
# le celle vicine si disturbano a vicenda, in downlink e in uplink.
**.downlinkInterference = true
**.uplinkInterference = true

# --- Bilancio di potenza ---
# Il collo di bottiglia qui e' l'UPLINK (sensori + status): dipende da ueTxPower e dai
# guadagni d'antenna, NON da eNodeBTxPower, che muove solo il downlink (le istruzioni
# da 1 kB). Valori da unita' veicolare, non da handset:
**.ueTxPower = 31dBm            # 3GPP Power Class 1 (veicolare); 26dBm era Class 2
**.eNodeBTxPower = 46dBm
**.antennaGainUe = 3dBi         # antenna da tetto, non isotropa (era 0 dBi)
**.antennGainEnB = 21dBi        # settoriale piu' direttiva (era 18 dBi). Il nome con
                                # il refuso ("antennGain") e' quello di simu5g.
**.cableLoss = 0.5dB            # radio integrata, feeder corto (era 2 dB)

# --- Area di simulazione ---
# La mobilita' passa le coordinate CARLA SENZA conversione (CarlaInetMobility::nextPosition),
# quindi qui si lavora nel sistema di riferimento della mappa: il percorso
# city_trip_world_4 sta in x [-381, 241], y [-319, 37], cioe' tutto in coordinate
# negative. L'area 0..2000m di prima non lo conteneva nemmeno.
# Delimita la MAPPA (Town04), non il percorso: cosi' regge anche gli attori che CARLA
# puo' spawnare fuori dal giro dell'ego.
**.mobility.constraintAreaMinX = -700m
**.mobility.constraintAreaMinY = -700m
**.mobility.constraintAreaMinZ = -50m
**.mobility.constraintAreaMaxX = 700m
**.mobility.constraintAreaMaxY = 700m
**.mobility.constraintAreaMaxZ = 100m

# ---------- MAIN IPv4 configurator: gives the UE a real route to the server ----------
*.configurator.config = xmldoc("./quic_demo.xml")

# ---------- gNB: quattro celle lungo il percorso ----------
# ATTENZIONE: senza initFromDisplayString=false, StationaryMobility IGNORA initialX/initialY
# e prende la posizione dalla stringa @display del .ned. Le righe initialX=450m/initialY=300m
# che c'erano prima erano quindi config morta: il gNB stava davvero in (726,277), cioe' a
# 713-1142 m dall'ego per TUTTO il giro, senza mai avvicinarsi.
*.gnb*.mobility.initFromDisplayString = false

# POSIZIONI: city_trip_world_4 e' un anello di ~1455 m (origine (13,-319) -> angolo ovest
# (-381,-2) -> tratto nord -> angolo est (241,-246) -> ritorno). Campionando la polilinea
# ogni 5 m e cercando i 4 punti che minimizzano la distanza MASSIMA auto-cella (k-means,
# 400 restart) si ottengono le coordinate qui sotto:
#   1 gNB in (-70,-141): distanza max 341 m, media 193 m
#   4 gNB              : distanza max 127 m, media  75 m   -> ~17 dB di path loss in meno
# Il baricentro singolo resta il compromesso migliore per UNA cella, ma su un anello
# nessun punto singolo puo' stare vicino a tutto il percorso: e' un limite geometrico,
# non di potenza, e infatti si risolve solo aggiungendo celle.
# NB: le antenne cadono sulla carreggiata perche' il criterio e' puramente geometrico.
# Spostarle a bordo strada di qualche decina di metri non cambia il bilancio (la
# distanza max resta ~130 m); se serve realismo, si ritoccano queste sei righe.
*.gnb1.mobility.initialX = -300m
*.gnb1.mobility.initialY = -10m
*.gnb2.mobility.initialX = -140m
*.gnb2.mobility.initialY = -100m
*.gnb3.mobility.initialX = -10m
*.gnb3.mobility.initialY = -230m
*.gnb4.mobility.initialX = 155m
*.gnb4.mobility.initialY = -235m
*.gnb*.mobility.initialZ = 0m

# MacNodeId espliciti: il default (1+simu5g_seq) li assegna nell'ordine di creazione dei
# moduli, quindi funzionerebbe lo stesso, ma fissarli rende deterministico il significato
# di nrServingNodeId e dei grafici per-cella.
*.gnb1.macNodeId = 1
*.gnb1.macCellId = 1
*.gnb2.macNodeId = 2
*.gnb2.macCellId = 2
*.gnb3.macNodeId = 3
*.gnb3.macCellId = 3
*.gnb4.macNodeId = 4
*.gnb4.macCellId = 4

# ---------- Handover ----------
# Senza handover le quattro antenne sarebbero DANNOSE: l'auto resterebbe agganciata a
# gnb1 per tutto il giro e le altre tre aggiungerebbero solo interferenza. Ricetta presa
# da simu5g/simulations/nr/cars (lo scenario veicolare di riferimento).
*.Vector*[*].cellularNic.nrPhy.dynamicCellAssociation = true   # all'avvio si aggancia alla cella con RSSI migliore
*.Vector*[*].cellularNic.nrPhy.enableHandover = true
*.gnb*.cellularNic.phy.enableHandover = true
# 50 ms di distacco per handover: la UE e' fuori copertura per ~1,5 slot di campionamento
# a 30 fps, quindi il watchdog di TODAgentApp registrera' slot a perdita totale a ogni
# cambio cella (e' il comportamento voluto: e' esattamente il costo che vogliamo misurare).
*.gnb*.cellularNic.phy.handoverLatency = 50ms
# Trigger di handover: il gNB annuncia la propria presenza ogni broadcastMessageInterval.
# A 1 s (default simu5g) un'auto a ~10 m/s percorre 10 m tra due valutazioni; e' la stessa
# scelta dello scenario nr/cars e tiene basso l'overhead.
*.gnb*.cellInfo.broadcastMessageInterval = 1s

# ---------- X2 (mesh completa fra le quattro celle) ----------
# Un x2App per ogni peer: con 4 celle a mesh piena sono 3 peer ciascuna. L'indirizzo di
# connessione e' "peer%interfaccia-del-peer-verso-di-me"; la corrispondenza gate->x2pppN
# dipende dall'ORDINE delle connessioni in DatagramNet.ned, dove e' annotata riga per riga.
*.gnb*.numX2Apps = 3
*.gnb*.x2App[*].server.localPort = 5000 + ancestorIndex(1)   # x2App[0]=5000, x2App[1]=5001, ...

*.gnb1.x2App[0].client.connectAddress = "gnb2%x2ppp0"
*.gnb1.x2App[1].client.connectAddress = "gnb3%x2ppp0"
*.gnb1.x2App[2].client.connectAddress = "gnb4%x2ppp0"

*.gnb2.x2App[0].client.connectAddress = "gnb1%x2ppp0"
*.gnb2.x2App[1].client.connectAddress = "gnb3%x2ppp1"
*.gnb2.x2App[2].client.connectAddress = "gnb4%x2ppp1"

*.gnb3.x2App[0].client.connectAddress = "gnb1%x2ppp1"
*.gnb3.x2App[1].client.connectAddress = "gnb2%x2ppp1"
*.gnb3.x2App[2].client.connectAddress = "gnb4%x2ppp2"

*.gnb4.x2App[0].client.connectAddress = "gnb1%x2ppp2"
*.gnb4.x2App[1].client.connectAddress = "gnb2%x2ppp2"
*.gnb4.x2App[2].client.connectAddress = "gnb3%x2ppp2"

# X2 viaggia su SCTP: Nagle ritarderebbe i messaggi piccoli di handover, gli heartbeat
# sporcherebbero le statistiche senza servire a nulla in simulazione.
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false

# ---------- Hero vehicle (VectorHero[0]) ----------
# WORKING cell association (NOT macCellId/masterId). Mobility stays TodCarlaInetMobility
# (position driven by CARLA); carla_id makes it spawn in CARLA as "hero".
# Con dynamicCellAssociation attivo questi due valori sono solo il fallback iniziale: la
# cella vera viene scelta all'init sul migliore RSSI (all'origine (13,-319) e' gnb3, a
# ~91 m) e poi cambia in corsa via handover.
*.VectorHero[0].servingNodeId = 0
*.VectorHero[0].nrServingNodeId = 1
# Posizione iniziale = origine di city_trip_world_4, cioe' dove CARLA fa lo spawn. Senza
# initFromDisplayString=false verrebbe presa dal @display del .ned (628,411), un punto di
# layout che con la mappa non c'entra nulla. Vale solo per il primo istante: da li' in poi
# la posizione arriva da CARLA.
*.VectorHero[0].mobility.initFromDisplayString = false
*.VectorHero[0].mobility.initialX = 13.2m
*.VectorHero[0].mobility.initialY = -318.7m
*.VectorHero[0].mobility.initialZ = 0m
*.VectorHero[0].mobility.carla_id = "hero"
*.VectorHero[0].mobility.route = "city_trip_world_4"
*.VectorHero[0].mobility.configuration_id = "simple_vehicle"
*.VectorHero[0].mobility.agent_configuration = "simple_agent"

# ---------- QUIC (same as the working INET datagram_test) ----------
**.quic.typename = "Quic"
**.quic.maxDatagramFrameSize = 1200B
**.quic.initialMaxData = 100000000B
**.quic.initialMaxStreamData = 100000000B
**.quic.numReceivedAckElicitingsBeforeAck = 1
# Coda datagram limitata: un frame sensore pesa ~32 kB in media e ~50 kB nel caso peggiore
# (tutti e 6 i sensori nello stesso frame), cioe' ~32-50 frammenti da datagramChunkSize=1000B.
# Con 64 la coda tiene poco piu' di un frame. Oltre, si scarta il PIU' VECCHIO:
# sul link va sempre il frame piu' recente. Senza tetto, appena il carico offerto supera la
# capacita' (basta che l'auto si allontani dal gNB) il backlog cresce all'infinito, si
# trasmettono solo frammenti fuori deadline e il loss_ratio resta inchiodato a 1.
**.quic.maxDatagramQueueLength = 64

# ---------- Hero app: SensorsManager (TODCarApp + SensorManager + sensors[]) ----------
*.VectorHero[0].numApps = 1
*.VectorHero[0].app[0].typename = "SensorsManager"
*.VectorHero[0].app[0].sensorNumber = 6
*.VectorHero[0].app[0].todCarApp.destAddress = "server"
*.VectorHero[0].app[0].todCarApp.destPort = 3000
*.VectorHero[0].app[0].todCarApp.statusUpdateInterval = 0.033s
*.VectorHero[0].app[0].todCarApp.statusMessageLength = 1kB
# MUST match server's instructionMessageLength (stream-0 instruction framing on the car)
*.VectorHero[0].app[0].todCarApp.instructionMessageLength = 1000B
*.VectorHero[0].app[0].todCarApp.datagramChunkSize = 1000B
*.VectorHero[0].app[0].todCarApp.encodingImageTime = normal(10ms, 0.5ms)
*.VectorHero[0].app[0].todCarApp.collectionDataTime = normal(15ms, 0.1ms)
*.VectorHero[0].app[0].todCarApp.zeroDelay = false
# 6 sensori: 4 telecamere (frontale HQ, 2 laterali MQ, posteriore LQ) + lidar 10Hz + radar.
# La qualita' e' modellata come dataSize (byte/frame) e updateInterval (rate). Carico offerto
# totale ~7.6 Mbps (< capacita' ~8.6 Mbps) => l'auto continua a guidare. Pesi loss uguali per
# sensore (TODAgentApp.cc:421); se vuoi dare piu' peso alla frontale, si tocca weightPerSensor.

# --- Camera FRONTALE (qualita' alta) ---
*.VectorHero[0].app[0].sensors[0].typename = "CameraSensorApp"
*.VectorHero[0].app[0].sensors[0].streamID = 1
*.VectorHero[0].app[0].sensors[0].sensorType = "camera_front"
*.VectorHero[0].app[0].sensors[0].dataSize = uniform(15000B, 20000B)   # ~17.5 KB
*.VectorHero[0].app[0].sensors[0].updateInterval = 0.033s              # 30 Hz

# --- Camera LATERALE sinistra (qualita' media) ---
*.VectorHero[0].app[0].sensors[1].typename = "CameraSensorApp"
*.VectorHero[0].app[0].sensors[1].streamID = 2
*.VectorHero[0].app[0].sensors[1].sensorType = "camera_left"
*.VectorHero[0].app[0].sensors[1].dataSize = uniform(6000B, 9000B)     # ~7.5 KB
*.VectorHero[0].app[0].sensors[1].updateInterval = 0.066s              # 15 Hz

# --- Camera LATERALE destra (qualita' media) ---
*.VectorHero[0].app[0].sensors[2].typename = "CameraSensorApp"
*.VectorHero[0].app[0].sensors[2].streamID = 3
*.VectorHero[0].app[0].sensors[2].sensorType = "camera_right"
*.VectorHero[0].app[0].sensors[2].dataSize = uniform(6000B, 9000B)     # ~7.5 KB
*.VectorHero[0].app[0].sensors[2].updateInterval = 0.066s              # 15 Hz

# --- Camera POSTERIORE (qualita' bassa, campionamento piu' ampio) ---
*.VectorHero[0].app[0].sensors[3].typename = "CameraSensorApp"
*.VectorHero[0].app[0].sensors[3].streamID = 4
*.VectorHero[0].app[0].sensors[3].sensorType = "camera_rear"
*.VectorHero[0].app[0].sensors[3].dataSize = uniform(3000B, 4500B)     # ~3.75 KB
*.VectorHero[0].app[0].sensors[3].updateInterval = 0.1s               # 10 Hz (campionamento ampio)

# --- LIDAR (10 Hz) ---
*.VectorHero[0].app[0].sensors[4].typename = "LidarSensorApp"
*.VectorHero[0].app[0].sensors[4].streamID = 5
*.VectorHero[0].app[0].sensors[4].sensorType = "lidar"
*.VectorHero[0].app[0].sensors[4].dataSize = uniform(9000B, 13000B)    # ~11 KB (compresso)
*.VectorHero[0].app[0].sensors[4].updateInterval = 0.1s               # 10 Hz

# --- RADAR ---
*.VectorHero[0].app[0].sensors[5].typename = "RadarSensorApp"
*.VectorHero[0].app[0].sensors[5].streamID = 6
*.VectorHero[0].app[0].sensors[5].sensorType = "radar"
*.VectorHero[0].app[0].sensors[5].dataSize = uniform(2000B, 3000B)     # ~2.5 KB
*.VectorHero[0].app[0].sensors[5].updateInterval = 0.05s              # 20 Hz

# ---------- Server: TOD agent + QUIC ----------
*.server.hasQuic = true
*.server.numApps = 1
# samplingInterval DEVE essere pari a todCarApp.statusUpdateInterval (0.033s qui):
# e' la cadenza con cui l'agente decide. Se i due clock non coincidono derivano, e
# uno slot finisce per vedere zero oppure due frame.
*.server.app[0].samplingInterval = 0.033s
# deadlineSlack: mezzo periodo. La sensibilita' al jitter era il punto debole della
# vecchia soglia a 2*frameInterval, dove pochi ms di ritardo facevano dichiarare
# persi slot in realta' ricevuti. Con lo slack un frame a cavallo del confine viene
# comunque contato; si paga in latenza. Con l'handover (50 ms di distacco) lo slot
# resta comunque vuoto, ed e' giusto che risulti perso.
*.server.app[0].deadlineSlack = 0.0165s
*.server.app[0].typename = "TODAgentApp"
*.server.app[0].localPort = 3000
*.server.app[0].instructionMessageLength = 1000B
# MUST match todCarApp.statusMessageLength (stream-0 status framing on the server)
*.server.app[0].statusMessageLength = 1kB
*.server.app[0].processingStatusTime = normal(15ms, 0.75ms)
# must match the ego's agent_id (TodCarlaInetMobility sets it to the vehicle's
# getFullName()); otherwise tod-carla's _compute_instruction gets KeyError ''.
*.server.app[0].agentId = "VectorHero[0]"

# ---------- CARLA co-simulation bridge (pyCARLANeT ZMQ server) ----------
*.carlaCommunicationManager.host = "localhost"
*.carlaCommunicationManager.port = 5555
*.carlaCommunicationManager.carlaConfiguration = ""
*.carlaCommunicationManager.networkActiveModuleType = ""
*.carlaCommunicationManager.extraInitParams = parseJSON("{'carla_world_configuration': 'world_4'}")
*.carlaCommunicationManager.moduleType = parseJSON("{'Vehicle': 'tod_network.nodes.CarlaCar', 'Pedestrian': 'tod_network.nodes.CarlaCar', 'EdgeCamera': 'tod_network.nodes.CarlaCar'}")
*.carlaCommunicationManager.moduleName = parseJSON("{'Vehicle': 'VectorVehicle', 'Pedestrian': 'VectorVehicle', 'EdgeCamera': 'VectorVehicle'}")


#############################################################################
# Config DatagramTOD-Bg — TOD + traffico veicolare di background
#
# Stesso scenario, ma l'ego non e' piu' l'unico utente delle quattro celle.
#
# Due tipi di veicolo, con ruoli diversi:
#
#  1) VectorTraffic[] — VEICOLI VERI. Sono CarlaCar dichiarati staticamente, quindi
#     OMNeT li annuncia a CARLA nel messaggio di init (moving_actors) e tod-carla li
#     spawna e li guida come attori 'passive': un BehaviorAgent li porta lungo la
#     loro route, senza teleoperazione. Si vedono nel mondo CARLA, ostacolano l'ego
#     come qualsiasi altra auto, e ALLO STESSO TEMPO sono UE 5G che occupano risorse
#     radio. La posizione in OMNeT arriva da CARLA a ogni step, come per l'ego.
#     Il limite e' quante configurazioni esistono in tod-carla: oggi bg_0/1/2.
#
#  2) bgVehicle[] — CARICO SINTETICO. NrUe puri con LinearMobility, nessun attore
#     CARLA dietro: NON si vedono nel mondo e non influenzano la guida. Servono solo
#     a spingere il carico offerto oltre i tre veicoli veri, senza dover scrivere
#     altri yaml in tod-carla. Default 0.
#
# Run:  tod-omnet -c DatagramTOD-Bg datagram_tod.ini
#############################################################################
[Config DatagramTOD-Bg]
extends = DatagramTOD
description = "TOD ego + traffico veicolare non-TOD, visibile in CARLA e sulla rete"

# ---------- 1) Veicoli veri, guidati da CARLA ----------
# 3 = quante terne (attore, agente, route) esistono in tod-carla: simple_vehicle_bg_N,
# simple_agent_bg_N, city_world_4_bg_N. Per averne di piu' servono altri tre yaml li'.
*.numTrafficVehicles = 3

# carla_id: identificatore dell'attore lato CARLA, deve essere unico.
*.VectorTraffic[0].mobility.carla_id = "bg_0"
*.VectorTraffic[1].mobility.carla_id = "bg_1"
*.VectorTraffic[2].mobility.carla_id = "bg_2"

# route/configuration_id/agent_configuration finiscono in carlaActorConfiguration
# (TodCarlaInetMobility.cc) e sono i nomi dei file yaml in tod-carla/configuration/.
# I file *_bg_* hanno "mode: passive", ed e' quello che li rende traffico e non ego.
*.VectorTraffic[0].mobility.route = "city_world_4_bg_0"
*.VectorTraffic[1].mobility.route = "city_world_4_bg_1"
*.VectorTraffic[2].mobility.route = "city_world_4_bg_2"
*.VectorTraffic[0].mobility.configuration_id = "simple_vehicle_bg_0"
*.VectorTraffic[1].mobility.configuration_id = "simple_vehicle_bg_1"
*.VectorTraffic[2].mobility.configuration_id = "simple_vehicle_bg_2"
*.VectorTraffic[0].mobility.agent_configuration = "simple_agent_bg_0"
*.VectorTraffic[1].mobility.agent_configuration = "simple_agent_bg_1"
*.VectorTraffic[2].mobility.agent_configuration = "simple_agent_bg_2"

# Posizione del primo istante = origine della rispettiva route (poi la detta CARLA).
# Senza initFromDisplayString=false verrebbe presa dal @display del .ned.
*.VectorTraffic[*].mobility.initFromDisplayString = false
*.VectorTraffic[0].mobility.initialX = 258.4m
*.VectorTraffic[0].mobility.initialY = -183.6m
*.VectorTraffic[1].mobility.initialX = 206.2m
*.VectorTraffic[1].mobility.initialY = -353.7m
*.VectorTraffic[2].mobility.initialX = 202.5m
*.VectorTraffic[2].mobility.initialY = -184.6m
*.VectorTraffic[*].mobility.initialZ = 0m

# Radio: dynamicCellAssociation e handover li prendono gia' dal pattern *.Vector*[*]
# della config base, qui serve solo il fallback iniziale di aggancio.
*.VectorTraffic[*].servingNodeId = 0
*.VectorTraffic[*].nrServingNodeId = 1

# Traffico di rete: uplink, profilo V2X/sensor-sharing, 1400B ogni 10 ms = 1,12 Mbps
# per veicolo. Niente TODCarApp: non sono teleoperati, il loro traffico e' solo
# carico che compete con quello dell'ego nello scheduler.
*.VectorTraffic[*].numApps = 1
*.VectorTraffic[*].app[0].typename = "UdpBasicApp"
*.VectorTraffic[*].app[0].destAddresses = "server"
*.VectorTraffic[*].app[0].destPort = 4000
*.VectorTraffic[*].app[0].messageLength = 1400B
*.VectorTraffic[*].app[0].sendInterval = 10ms
*.VectorTraffic[*].app[0].startTime = uniform(0s, 10ms)
*.VectorTraffic[*].app[0].packetName = "BgV2X"

# ---------- 2) Carico sintetico aggiuntivo (default: nessuno) ----------
# Alzalo se vuoi piu' carico dei tre veicoli veri: ogni UE aggiunge 1,12 Mbps di
# uplink. Per uno sweep: *.numBgVehicles = ${bg=0,6,12}
*.numBgVehicles = 0

# LinearMobility: direzione costante e rimbalzo sui bordi dell'area. Non e' guida
# realistica (per quella ci sono i VectorTraffic), serve solo a far attraversare i
# confini di cella, quindi handover e interferenza che cambiano nel tempo.
*.bgVehicle[*].mobility.typename = "LinearMobility"
*.bgVehicle[*].mobility.initFromDisplayString = false
*.bgVehicle[*].mobility.speed = uniform(8mps, 14mps)     # ~29-50 km/h, andatura urbana
# Li confino nel bounding box del percorso dell'ego: e' li' che stanno le quattro
# celle, quindi e' li' che il loro traffico da' fastidio a quello che ci interessa.
# L'area globale (+-700 m) li lascerebbe vagare dove non c'e' copertura utile.
# La posizione iniziale, non assegnata, e' uniforme dentro questi limiti.
*.bgVehicle[*].mobility.constraintAreaMinX = -381m
*.bgVehicle[*].mobility.constraintAreaMaxX = 241m
*.bgVehicle[*].mobility.constraintAreaMinY = -319m
*.bgVehicle[*].mobility.constraintAreaMaxY = 37m
*.bgVehicle[*].mobility.constraintAreaMinZ = 0m
*.bgVehicle[*].mobility.constraintAreaMaxZ = 0m

# Aggancio e handover. Il pattern *.Vector*[*] non li copre (non si chiamano Vector),
# quindi qui va ripetuto tutto.
*.bgVehicle[*].servingNodeId = 0
*.bgVehicle[*].nrServingNodeId = 1
*.bgVehicle[*].cellularNic.nrPhy.dynamicCellAssociation = true
*.bgVehicle[*].cellularNic.nrPhy.enableHandover = true

# Stesso profilo di traffico dei veicoli veri: solo uplink, perche' e' li' il collo
# di bottiglia dello scenario (i sensori dell'ego); qualche kbps di downlink in piu'
# non cambierebbe niente. startTime sfasato per non partire tutti nello stesso TTI.
*.bgVehicle[*].numApps = 1
*.bgVehicle[*].app[0].typename = "UdpBasicApp"
*.bgVehicle[*].app[0].destAddresses = "server"
*.bgVehicle[*].app[0].destPort = 4000
*.bgVehicle[*].app[0].messageLength = 1400B
*.bgVehicle[*].app[0].sendInterval = 10ms
*.bgVehicle[*].app[0].startTime = uniform(0s, 10ms)
*.bgVehicle[*].app[0].packetName = "BgV2X"

# Un solo sink sul server per tutti i mittenti, veri e sintetici (UdpSink accetta da
# chiunque sulla porta). app[0] resta la TODAgentApp.
*.server.numApps = 2
*.server.app[1].typename = "UdpSink"
*.server.app[1].localPort = 4000
