include General.ini

#############################################################################
# Datagram TOD scenario (Fase 2)
#
# The hero vehicle (VectorVehicle[0]) streams its sensor data over QUIC
# DATAGRAM (RFC 9221: unreliable, unordered, NO retransmission), while the
# status/control channel stays on reliable QUIC stream 0 (carrying statusId,
# frameId and the list of expected sensor streamIDs for that frame).
# The TOD agent (server) reassembles per (frameId, streamID) and computes a
# per-sensor WEIGHTED loss_ratio, sent back inside the instruction message.
#
# QUIC DATAGRAM support lives in INET as a patch (tod-omnet/inet-patches/).
# INET must be built WITH the patch applied: run `setup-inet.sh apply` first.
#
# Run:  opp_run/tod-omnet -c DatagramTOD datagram_tod.ini   (needs CARLA+tod-carla up)
#############################################################################
[Config DatagramTOD]
sim-time-limit = 20s

# ---------- headless / base-config fixes ----------
# General.ini sets these Tx-power params unitless; this simu5g build declares
# them @unit(dBm), so override here (more specific than [General]) with units.
**.ueTxPower = 26dBm
**.eNodeBTxPower = 46dBm
# General.ned's IntegratedVisualizer pulls in an OSG (3D) visualizer that isn't
# linked in this INET build; not needed for a headless Cmdenv run.
*.visualizer.osgVisualizer.typename = ""

# ---------- CARLA co-simulation bridge (pyCARLANeT ZMQ server) ----------
# tod-omnet (this side) is the ZMQ *client*; tod-carla binds :5555 as server.
# With WSL "mirrored" networking, localhost reaches the Windows host directly.
# In NAT mode, set host to the Windows host IP reachable from WSL and open 5555.
*.carlaCommunicationManager.host = "localhost"
*.carlaCommunicationManager.port = 5555
*.carlaCommunicationManager.carlaConfiguration = ""
*.carlaCommunicationManager.networkActiveModuleType = ""
# config_name MUST match the scenario selected on the tod-carla (Python) side.
*.carlaCommunicationManager.extraInitParams = parseJSON("{'config_name': 'red_light_violation'}")

# ---------- Enable QUIC on the TOD agent host ----------
# StandardHost has no QUIC by default (hasQuic=false); CarlaCar already has it.
*.server.hasQuic = true

# ---------- QUIC DATAGRAM sizing ----------
# Each sensor datagram must fit within maxDatagramFrameSize, otherwise INET
# drops the frame. Keep datagramChunkSize (below) < this value (header room).
**.quic.maxDatagramFrameSize = 1200B

# ---------- Hero vehicle application ----------
# Use the SensorsManager compound (TODCarApp + SensorManager + sensors[]) so the
# sensor -> datagram path is exercised. (General.ini installs a bare TODCarApp;
# the entries it sets on app[0] that don't exist on SensorsManager simply show
# up as harmless "unused entry" warnings.)
*.VectorVehicle[0].numApps = 1
*.VectorVehicle[0].app[0].typename = "SensorsManager"
*.VectorVehicle[0].app[0].sensorNumber = 3

# TODCarApp parameters are now nested inside the compound: app[0].todCarApp.*
*.VectorVehicle[0].app[0].todCarApp.destAddress = "server"
*.VectorVehicle[0].app[0].todCarApp.destPort = 3000
*.VectorVehicle[0].app[0].todCarApp.statusUpdateInterval = 0.016s   # ~60 fps frame tick
*.VectorVehicle[0].app[0].todCarApp.statusMessageLength = 1kB       # small: metadata only now
*.VectorVehicle[0].app[0].todCarApp.datagramChunkSize = 1000B       # < maxDatagramFrameSize
*.VectorVehicle[0].app[0].todCarApp.encodingImageTime = normal(10ms, 0.5ms)
*.VectorVehicle[0].app[0].todCarApp.collectionDataTime = normal(15ms, 0.1ms)
*.VectorVehicle[0].app[0].todCarApp.zeroDelay = false               # false => remote driver over 5G

# Sensor set: camera (every frame ~20 KB), lidar (10 Hz ~90 KB), radar (~15 Hz ~5 KB).
# Distinct streamID per sensor so the agent tracks each one separately; the slow
# sensors appear only in some frames, exercising the dynamic expectedStreams list.
*.VectorVehicle[0].app[0].sensors[0].typename = "CameraSensorApp"
*.VectorVehicle[0].app[0].sensors[0].streamID = 1
*.VectorVehicle[0].app[0].sensors[0].sensorType = "camera"
*.VectorVehicle[0].app[0].sensors[1].typename = "LidarSensorApp"
*.VectorVehicle[0].app[0].sensors[1].streamID = 2
*.VectorVehicle[0].app[0].sensors[1].sensorType = "lidar"
*.VectorVehicle[0].app[0].sensors[2].typename = "RadarSensorApp"
*.VectorVehicle[0].app[0].sensors[2].streamID = 3
*.VectorVehicle[0].app[0].sensors[2].sensorType = "radar"

# ---------- TOD agent (server) ----------
# server.app[0] = TODAgentApp is already configured in General.ini
# (localPort 3000, processingStatusTime, instructionMessageLength, agentId="").
